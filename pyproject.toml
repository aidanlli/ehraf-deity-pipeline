[project]
name = "ehraf-deity-pipeline"
version = "3.0.0"
description = "Scraping, LLM-based identification, and classification of deities in the eHRAF World Cultures database"
readme = "README.md"
authors = [{ name = "Aidan Li", email = "aidanlli1411@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Part 1: eHRAF scraping pipeline (code/scraping/)
scraping = [
    "beautifulsoup4>=4.12",
    "chardet>=5.0",
    "requests>=2.31",
    "selenium>=4.18",
    "webdriver-manager>=4.0",
]
# Part 2: LLM identification/classification pipeline and evaluation (code/llm_pipeline/)
llm = [
    "deep-translator>=1.11",
    "fuzzywuzzy>=0.18",
    "google-genai>=1.0",
    "langdetect>=1.0.9",
    "openai>=1.40",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "python-Levenshtein>=0.25",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "tiktoken>=0.7",
]
# Exploratory language-ID / translation notebooks (notebooks/)
translation = [
    "deepl>=1.18",
    "fasttext-numpy2-wheel>=0.9.2",
    "huggingface-hub>=0.23",
    "protobuf>=4.25",
    "pycountry>=24.6",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "transformers>=4.40",
]
dev = [
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pyflakes + core pycodestyle + import sorting; F841 (unused local) is
# tolerated in exploratory/analysis code.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# Legacy reference scripts keep their original inline-import style.
"code/llm_pipeline/legacy/*" = ["E402", "E722"]
# Notebook cells legitimately import after setup statements.
"*.ipynb" = ["E402", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["config"]
